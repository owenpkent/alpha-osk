name: Fuzz nightly

# The property-based modules, run once a day under the deep Hypothesis
# profile (tests/conftest.py, "alpha-osk-deep"): about twenty times the
# examples of the normal suite and NOT derandomized, so every night draws
# examples nobody has tried yet. The normal suite stays on a fixed seed so a
# pull request never goes red for a reason it did not cause; this job is
# where new inputs are allowed to surprise us.
#
# A failure prints a `@reproduce_failure(...)` line (print_blob). Paste it
# onto the failing test locally, or rerun with the same profile; see
# "Nightly fuzzing" in docs/build/CI.md. Fix the bug and add the minimal
# input as a named regression test in the normal suite.
#
# Like the OSV nightly, this stops quietly if the repository sees no
# activity for 60 days, and the failure email goes to whoever last edited
# the cron line.

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Property fuzzing (deep profile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Same runtime libraries as the test job in ci.yml: importing the
      # PySide6 modules the bridge pulls in dlopens the host's GL stack.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libxrender1 \
            fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Fuzz
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest
          tests/test_property_loader_fuzz.py
          tests/test_property_import_hardening.py
          tests/test_property_prediction_invariants.py
          --hypothesis-profile=alpha-osk-deep
          -n auto
          -p no:cacheprovider
          -q
          --hypothesis-show-statistics
