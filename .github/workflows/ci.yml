name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. `branches: [main]` here means a
  # PR stacked on another feature branch runs NO checks at all, and GitHub
  # still shows it a green row from whatever other apps are installed, so it
  # reads as reviewed. PR #14 sat that way: 65 files, every module under
  # src/, zero lint / type / test signal.
  pull_request:

permissions:
  contents: read

# One run per ref, and a new push cancels the one it supersedes.
#
# Without this, pushing four commits in quick succession starts four full
# runs, and the three that are already out of date keep a runner for their
# full length before reporting a failure that was fixed two commits ago.
# That happened: three consecutive red notifications, all for the same
# assertion, all already fixed on main by the time they arrived, which is
# worse than slow because it trains you to ignore the red.
#
# Grouped by ref rather than by commit, so this cancels superseded runs of
# the *same* branch and never one of another. A cancelled intermediate
# commit is the intended outcome: what needs to be green is the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Pinned, and kept in step with requirements-dev.txt. `ruff check` is
      # stable enough across releases to float; `ruff format` is not, and it
      # gates below. On a floating install a new ruff release turns this job
      # red on a tree nobody touched.
      - run: pip install ruff==0.16.2
      - run: ruff check src/ tests/
      # Formatting is a separate gate from linting: `ruff check` does not
      # look at layout, so without this the tree drifts from ruff-format's
      # output unnoticed (it had, in 46 of 57 files, despite the
      # ruff-format hook in .pre-commit-config.yaml, which only runs for
      # contributors who have actually run `pre-commit install`).
      # Reproduce locally with `python check.py`; fix with
      # `ruff format src/ tests/`.
      - run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install mypy PySide6
      - run: mypy src/ --ignore-missing-imports
      # mypy prunes `if sys.platform == "win32"` bodies as unreachable on
      # a linux runner, so the pass above type-checks the Windows half of
      # every platform branch nowhere. Alpha-OSK's primary target is
      # Windows. Mirrors check.py's second mypy step.
      - run: mypy src/ --ignore-missing-imports --platform win32

  test:
    name: Test (${{ matrix.os }} ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    # A shard finishes in about six minutes, so one that reaches twenty has
    # hung, not slowed. Without this the default is six hours: on 2026-09-03
    # a windows shard reached 84% in four minutes and then produced nothing
    # for twenty-eight more, holding its PR until someone cancelled it by
    # hand. The rerun passed in six.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # One shard failing must not cancel its siblings. The default
      # (fail-fast: true) cancelled the whole matrix on the first red,
      # which cost real signal: a single flaky ubuntu test took the
      # windows job down with it and the run reported two failures when
      # there was one, with nothing to say whether windows would have
      # passed. Every shard runs to completion now.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Sharded across machines, on top of `-n auto` sharding across
        # each machine's cores. The two axes are different and both are
        # needed: the runners have 4 cores against a dev box's 16, so a
        # suite that takes a minute locally took 14 minutes here on
        # ubuntu and 19 on windows, and every push waited on the slower
        # of the two. The split is by a stable hash of the test node id
        # (tests/conftest.py::pytest_collection_modifyitems), so it needs
        # no recorded-durations artefact to stay balanced and no new
        # dependency to maintain.
        #
        # Raising this number is the lever if the suite grows: 4 was
        # measured, not guessed. Below about 4 the per-shard fixed cost
        # (runner start, checkout, pip install: roughly 40 s with the
        # cache warm) is lost in the noise; far above it that cost starts
        # to dominate what each shard actually runs.
        shard: [0, 1, 2, 3]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # Sharding multiplies the number of times this job installs its
          # dependencies by four, so the install stops being a rounding
          # error and starts being per-shard overhead. PySide6 alone is a
          # ~100 MB wheel and took 52 s on the windows runner.
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # PySide6 ships its own Qt, but Qt still dlopens the host's GL/EGL and
      # xkb libraries, which the runner image does not carry. Without these
      # `from PySide6.QtGui import ...` raises ImportError: libEGL.so.1 at
      # *collection* time, which aborts the entire pytest run rather than
      # failing one module. The headless QML tests are the only guard against
      # a QML binding error shipping as a blank keyboard, so install the libs
      # and let them run rather than skipping them on CI.
      #
      # fonts-dejavu-core is listed for a different reason and is NOT
      # optional. With no proportional font installed, Qt falls back to a
      # fixed-width placeholder where every glyph has the same advance, which
      # makes the prediction bar's width arithmetic self-consistent and its
      # 260-configuration no-elide sweep incapable of failing. Those tests
      # detect that and skip themselves rather than report a meaningless
      # pass, and a real eliding bug already shipped once because the only
      # machine it was checked on could not see it. Pinned here so an image
      # change cannot silently take the sweep away everywhere at once.
      #
      # The Windows runner and Windows dev machines now run the sweep too:
      # tests/conftest.py points QT_QPA_FONTDIR at the system fonts there.
      # Until that landed this job was the only place it ran anywhere, so a
      # geometry change could pass a developer's full local gate and come
      # back red from here twenty minutes later, which it did.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libxrender1 \
            fonts-dejavu-core \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # `-n auto`, matching check.py.
      #
      # This job was serial on the argument that it is the release gate and
      # its runners have far fewer cores than a dev box. The cores are real
      # (4 here against 16 there) but the argument was wrong about where the
      # time goes: building a KeyboardBridge costs about a second, the
      # fixture is function-scoped, and there are ~1550 tests, so the run is
      # dominated by per-test setup repeated 1550 times. That shards almost
      # linearly whatever the core count, which is why the same change took
      # the local gate from 25 minutes to under one.
      #
      # Sharding safely needed one property that is already established:
      # anything process-external must be keyed per worker. QSettings goes
      # through tests/qt_settings_scope.py, which suffixes the scope with
      # PYTEST_XDIST_WORKER, and Hypothesis is derandomized with no example
      # database. A new test touching the registry, a fixed path or a port
      # has to do the same.
      #
      # pytest-cov combines the workers' data before --cov-fail-under is
      # evaluated, so the coverage gate is unaffected.
      #
      # `--cov-fail-under` cannot live here any more: each shard only
      # runs a quarter of the suite, so each would measure roughly a
      # quarter of the lines and every shard would fail the gate. The
      # data files are uploaded instead and the `coverage` job below
      # combines them per OS and applies the threshold to the whole.
      - name: Run tests
        run: >-
          python -m pytest -n auto
          --shard-id ${{ matrix.shard }} --shard-count 4
          --cov=src --cov-report=
      # Named for combine's benefit: `coverage combine` only picks up
      # files matching `.coverage.*`.
      - name: Name the coverage data for this shard
        run: python -c "import os; os.replace('.coverage', '.coverage.${{ matrix.os }}.${{ matrix.shard }}')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.shard }}
          path: .coverage.${{ matrix.os }}.${{ matrix.shard }}
          # Not optional: the file starts with a dot, and upload-artifact
          # has excluded hidden files by default since v4.4. Without this
          # every upload here is empty, the combine job below finds no
          # data, and the coverage gate silently stops gating.
          include-hidden-files: true
          retention-days: 1

  # The coverage gate, which the sharded test jobs can no longer apply
  # themselves. Matrixed per OS rather than combining both, because a
  # coverage data file records absolute source paths: the two runners
  # disagree about those, and combining across them either drops one
  # side's measurements or needs a `[paths]` remap that would have to be
  # kept in step with two runner images. Per OS, the workspace path is
  # identical across shards and no remapping is involved.
  #
  # **Which is why this runs on `matrix.os`, not on ubuntu.** Same
  # reason, one step further, and it is easy to miss because the job
  # only reads files: combining is not path-neutral either. Written as
  # `runs-on: ubuntu-latest` it fed the windows shards' data to a linux
  # box, which joined the recorded absolute paths onto its own workspace
  # and reported a `No source for code` error naming a windows
  # workspace path joined onto a linux one. The combine has to happen
  # where the data was produced.
  #
  # Gating per OS also preserves exactly what the unsharded jobs
  # promised: each platform's own run had to clear 60% on its own, and
  # each still does. That matters because the `if sys.platform ==
  # "win32"` bodies are measured on precisely one of the two.
  coverage:
    name: Coverage (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    # Same reasoning as the test job: this runs the whole suite on one
    # machine and can hang the same way.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Pinned like every other tool version here, and kept in step with
      # what pytest-cov==7.1.0 resolves to, so a coverage release cannot
      # turn this red on a tree nobody touched.
      - run: pip install coverage==7.15.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-${{ matrix.os }}-*
          path: coverage-data
          merge-multiple: true
      # `shell: bash` explicitly, because this now runs on windows too
      # and the default there is pwsh, which does not stop on the first
      # failing command: GitHub only checks the *last* exit code, so a
      # failed `combine` followed by a `report` that happens to succeed
      # would pass the step. bash is present on both runners and `-e`
      # is what makes the two lines a gate rather than a suggestion.
      - name: Combine and check
        shell: bash
        run: |
          coverage combine coverage-data
          coverage report --show-missing --fail-under=60

  # One stable check name for branch protection to require.
  #
  # Required status checks are configured by *name*, in the repo's
  # settings rather than in this file, so a sharded matrix would
  # otherwise mean listing all eight shards there and re-configuring
  # protection on every change to the shard count. A stale entry does
  # not fail loudly: the named check simply never reports, and every PR
  # blocks for ever on something that cannot go green. That is exactly
  # what sharding did to `Test (ubuntu-latest)` and
  # `Test (windows-latest)`, which are the names this job replaces.
  #
  # `needs` alone is not sufficient, and the reason is the part worth
  # remembering: a job whose dependency fails or is cancelled is
  # *skipped*, and a skipped check is not a failed one. Required checks
  # treat it as still-pending rather than red, so without `if: always()`
  # plus the explicit assertions below, the gate would go quiet at
  # precisely the moment it is supposed to be loud.
  #
  # `needs.<job>.result` for a matrix job is the aggregate: success only
  # when every shard succeeded.
  tests-passed:
    name: Tests
    needs: [test, coverage]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the shard and coverage results
        run: |
          echo "test shards: ${{ needs.test.result }}"
          echo "coverage:    ${{ needs.coverage.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.coverage.result }}" = "success" ] || exit 1

  # Reads the committed lockfiles (requirements-dev.txt for Python,
  # backend/cf-worker/package-lock.json for the worker) and queries
  # the OSV database for known CVEs.  Pinned to the v2.3.8 SHA per
  # the audit-driven hardening posture (tag refs are mutable).
  #
  # fail-on-vuln: true gates merges on unknown CVEs.  The known
  # Wrangler-3.x esbuild/undici findings were resolved by upgrading
  # to Wrangler 4.x; the transitive lxml advisory was resolved by
  # pinning lxml>=6.1.0 in requirements-dev.txt.  If a future CVE
  # appears and we genuinely can't fix it before the next push,
  # quarantine it with an `osv-scanner.toml` ignore entry rather
  # than flipping this back to false globally.
  #
  # upload-sarif: false by default.  Originally because the source repo
  # was private and GitHub Advanced Security (required for SARIF upload
  # to the Security tab on private repos) was not enabled.  The repo
  # went public on 2026-05-16, so code scanning is now free and SARIF
  # upload could be flipped on — kept off for now because findings still
  # surface in the action's job summary / annotations, and surfacing
  # them in the public Security tab also publishes them to anyone
  # watching.  Flip to true once you're comfortable with that.
  osv-scan:
    name: OSV Scanner (deps CVE check)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=requirements-dev.txt
        --lockfile=backend/cf-worker/package-lock.json
      fail-on-vuln: true
      upload-sarif: false
