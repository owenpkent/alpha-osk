name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. `branches: [main]` here means a
  # PR stacked on another feature branch runs NO checks at all, and GitHub
  # still shows it a green row from whatever other apps are installed, so it
  # reads as reviewed. PR #14 sat that way: 65 files, every module under
  # src/, zero lint / type / test signal.
  pull_request:

permissions:
  contents: read

# One run per ref, and a new push cancels the one it supersedes.
#
# Without this, pushing four commits in quick succession starts four full
# runs, and the three that are already out of date keep a runner for their
# full length before reporting a failure that was fixed two commits ago.
# That happened: three consecutive red notifications, all for the same
# assertion, all already fixed on main by the time they arrived, which is
# worse than slow because it trains you to ignore the red.
#
# Grouped by ref rather than by commit, so this cancels superseded runs of
# the *same* branch and never one of another. A cancelled intermediate
# commit is the intended outcome: what needs to be green is the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Pinned, and kept in step with requirements-dev.txt. `ruff check` is
      # stable enough across releases to float; `ruff format` is not, and it
      # gates below. On a floating install a new ruff release turns this job
      # red on a tree nobody touched.
      - run: pip install ruff==0.16.2
      - run: ruff check src/ tests/
      # Formatting is a separate gate from linting: `ruff check` does not
      # look at layout, so without this the tree drifts from ruff-format's
      # output unnoticed (it had, in 46 of 57 files, despite the
      # ruff-format hook in .pre-commit-config.yaml, which only runs for
      # contributors who have actually run `pre-commit install`).
      # Reproduce locally with `python check.py`; fix with
      # `ruff format src/ tests/`.
      - run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install mypy PySide6
      - run: mypy src/ --ignore-missing-imports
      # mypy prunes `if sys.platform == "win32"` bodies as unreachable on
      # a linux runner, so the pass above type-checks the Windows half of
      # every platform branch nowhere. Alpha-OSK's primary target is
      # Windows. Mirrors check.py's second mypy step.
      - run: mypy src/ --ignore-missing-imports --platform win32

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # PySide6 ships its own Qt, but Qt still dlopens the host's GL/EGL and
      # xkb libraries, which the runner image does not carry. Without these
      # `from PySide6.QtGui import ...` raises ImportError: libEGL.so.1 at
      # *collection* time, which aborts the entire pytest run rather than
      # failing one module. The headless QML tests are the only guard against
      # a QML binding error shipping as a blank keyboard, so install the libs
      # and let them run rather than skipping them on CI.
      #
      # fonts-dejavu-core is listed for a different reason and is NOT
      # optional. With no proportional font installed, Qt falls back to a
      # fixed-width placeholder where every glyph has the same advance, which
      # makes the prediction bar's width arithmetic self-consistent and its
      # 260-configuration no-elide sweep incapable of failing. Those tests
      # detect that and skip themselves rather than report a meaningless
      # pass, and a real eliding bug already shipped once because the only
      # machine it was checked on could not see it. Pinned here so an image
      # change cannot silently take the sweep away everywhere at once.
      #
      # The Windows runner and Windows dev machines now run the sweep too:
      # tests/conftest.py points QT_QPA_FONTDIR at the system fonts there.
      # Until that landed this job was the only place it ran anywhere, so a
      # geometry change could pass a developer's full local gate and come
      # back red from here twenty minutes later, which it did.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6 libxrender1 \
            fonts-dejavu-core \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # `-n auto`, matching check.py.
      #
      # This job was serial on the argument that it is the release gate and
      # its runners have far fewer cores than a dev box. The cores are real
      # (4 here against 16 there) but the argument was wrong about where the
      # time goes: building a KeyboardBridge costs about a second, the
      # fixture is function-scoped, and there are ~1550 tests, so the run is
      # dominated by per-test setup repeated 1550 times. That shards almost
      # linearly whatever the core count, which is why the same change took
      # the local gate from 25 minutes to under one.
      #
      # Sharding safely needed one property that is already established:
      # anything process-external must be keyed per worker. QSettings goes
      # through tests/qt_settings_scope.py, which suffixes the scope with
      # PYTEST_XDIST_WORKER, and Hypothesis is derandomized with no example
      # database. A new test touching the registry, a fixed path or a port
      # has to do the same.
      #
      # pytest-cov combines the workers' data before --cov-fail-under is
      # evaluated, so the coverage gate is unaffected.
      - name: Run tests
        run: python -m pytest -n auto --cov=src --cov-report=term-missing --cov-fail-under=60

  # Reads the committed lockfiles (requirements-dev.txt for Python,
  # backend/cf-worker/package-lock.json for the worker) and queries
  # the OSV database for known CVEs.  Pinned to the v2.3.8 SHA per
  # the audit-driven hardening posture (tag refs are mutable).
  #
  # fail-on-vuln: true gates merges on unknown CVEs.  The known
  # Wrangler-3.x esbuild/undici findings were resolved by upgrading
  # to Wrangler 4.x; the transitive lxml advisory was resolved by
  # pinning lxml>=6.1.0 in requirements-dev.txt.  If a future CVE
  # appears and we genuinely can't fix it before the next push,
  # quarantine it with an `osv-scanner.toml` ignore entry rather
  # than flipping this back to false globally.
  #
  # upload-sarif: false by default.  Originally because the source repo
  # was private and GitHub Advanced Security (required for SARIF upload
  # to the Security tab on private repos) was not enabled.  The repo
  # went public on 2026-05-16, so code scanning is now free and SARIF
  # upload could be flipped on — kept off for now because findings still
  # surface in the action's job summary / annotations, and surfacing
  # them in the public Security tab also publishes them to anyone
  # watching.  Flip to true once you're comfortable with that.
  osv-scan:
    name: OSV Scanner (deps CVE check)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=requirements-dev.txt
        --lockfile=backend/cf-worker/package-lock.json
      fail-on-vuln: true
      upload-sarif: false
