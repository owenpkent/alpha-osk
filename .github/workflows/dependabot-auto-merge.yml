name: Dependabot auto-merge

# Queues Dependabot's patch and minor updates to squash-merge once every
# required check on main has passed. A major version bump is left for a
# person, because that is where an upgrade can change behaviour the tests do
# not cover. Why this is shaped the way it is: docs/build/CI.md, "Dependabot
# auto-merge". The pattern is GitHub's own:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
on: pull_request

# Nothing by default; the one job below asks for exactly what it uses.
permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Three conditions, and each closes a different door. The PR was opened
    # by Dependabot. The event was caused by Dependabot too, so a person
    # pushing a commit onto a Dependabot branch takes the PR over rather than
    # having auto-merge switched on underneath them. And this repository, so
    # a fork never runs it.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.repository == 'owenpkent/alpha-osk'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout. This job never runs the pull request's code; it reads
      # Dependabot's metadata and asks GitHub to merge later.
      - name: Read what Dependabot is updating
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Branch protection requires one approving review, and a patch or
      # minor bump whose checks pass is exactly the change that review exists
      # to wave through, so the workflow gives it before it queues the merge.
      # GITHUB_TOKEN can approve only because the repository's Actions
      # setting "Allow GitHub Actions to create and approve pull requests"
      # is on; with it off every Dependabot PR stalls at "Review required"
      # rather than merging unreviewed, which is the safe way to fail.
      - name: Approve patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # update-type is the highest semver change in the PR, so a grouped PR
      # carrying one major bump is left for a person as a whole.
      - name: Queue patch and minor updates to merge when checks pass
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
