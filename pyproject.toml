[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "slow: marks tests that take >1s (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# E402: importorskip must come before the guarded import
"tests/test_hybrid_predictor.py" = ["E402"]
"tests/test_keyboard_bridge.py" = ["E402"]

[tool.mypy]
# The project's minimum supported Python, and it has to be a version mypy
# will actually accept: mypy dropped 3.9 as a target, so `python_version =
# "3.9"` was rejected at startup with a warning and mypy silently fell back
# to its own default. The declared floor was therefore enforced by nothing,
# and no gate would have caught 3.10-or-newer syntax reaching src/. CI runs
# 3.11, so 3.10 is type-checked but not executed; anything a type checker
# cannot see (a stdlib function that changed behaviour, say) is still only
# proven on 3.11. Keep this in step with the floor asserted by
# run.py::check_python_version and build/*/build.py.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.platform.windows", "src.platform.linux", "src.keyboard_app"]
ignore_errors = true

# Optional transitive deps that may be installed locally (e.g. via the
# commented-out transformers extra in requirements.txt) but never on
# CI.  `follow_imports = "skip"` bypasses parsing of these libraries so
# their newer-syntax features don't crash mypy when parsed against our
# target version.  CI behaviour is
# unchanged — these modules aren't installed there, so the override is
# a no-op.
[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "transformers.*", "torch.*"]
follow_imports = "skip"
